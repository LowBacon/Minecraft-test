<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optimized Voxel Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="instructions">
        <h2>MINECRAFT JS CLONE</h2>
        <p>Click to Lock Mouse & Play</p>
        <p>Movement: WASD | Look: Mouse</p>
        <p>Hotbar: 1 - 4 Keys</p>
    </div>
    
    <div id="gui-container">
        <div id="item-label">Grass Block</div>
        <div id="hotbar">
            <div class="slot active" data-slot="0"><div class="item grass"></div></div>
            <div class="slot" data-slot="1"><div class="item dirt"></div></div>
            <div class="slot" data-slot="2"><div class="item stone"></div></div>
            <div class="slot" data-slot="3"><div class="item wood"></div></div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Optimized Web Voxel Craft</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'Courier New', Courier, monospace; user-select: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; transform: translate(-50%, -50%);
            color: white; font-weight: bold; font-size: 24px;
            pointer-events: none; z-index: 5;
        }
        #hud {
            position: absolute; top: 10px; left: 10px;
            color: #00ff00; background: rgba(0,0,0,0.7);
            padding: 10px; font-size: 12px; border-radius: 3px; pointer-events: none;
        }
        /* UI Hotbar & Inventory */
        #hotbar {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); background: rgba(30, 30, 30, 0.85);
            padding: 6px; border-radius: 4px; display: flex; gap: 6px;
            border: 2px solid #555; pointer-events: auto;
        }
        .slot {
            width: 46px; height: 46px; border: 3px solid #3a3a3a;
            background: #8b8b8b; display: flex; align-items: center;
            justify-content: center; color: white; font-size: 10px;
            font-weight: bold; text-align: center; cursor: pointer;
        }
        .slot.active { border-color: #ffffff; box-shadow: 0 0 8px #fff; }
        
        /* Creative Inventory Menu */
        #creative-hub {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 340px; height: 240px;
            background: rgba(40, 40, 40, 0.95); border: 3px solid #666;
            padding: 15px; display: none; flex-wrap: wrap; gap: 8px;
            overflow-y: auto; border-radius: 6px; z-index: 20;
        }
        .hub-title { width: 100%; color: #fff; margin-bottom: 5px; font-size: 14px; text-transform: uppercase;}
        
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: flex;
            justify-content: center; align-items: center;
            color: white; cursor: pointer; text-align: center; z-index: 30;
        }
    </style>
</head>
<body>
    <div id="blocker">
        <div>
            <h1 style="margin:0 0 10px 0;">VoxelCraft Lite</h1>
            <p>Optimized for Low-End Laptops</p>
            <strong style="color:#ffcc00;">CLICK TO PLAY</strong><br><br>
            Move: WASD | Jump: SPACE<br>
            Mine: Hold Left Click | Place: Right Click<br>
            Inventory Hub: Press [ E ]
        </div>
    </div>

    <div id="crosshair">+</div>
    <div id="hud">FPS/RAM Optimized Engine<br>Chunk Buffers: Active<br>Press E for Creative Hub</div>
    
    <div id="creative-hub">
        <div class="hub-title">Creative Inventory (Click to Equip)</div>
    </div>

    <div id="hotbar"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- Core Engine Configuration ---
        const CHUNK_SIZE = 16;
        const WORLD_CHUNKS_AXIS = 3; // 3x3 Chunks surrounding player safely
        const PLAYER_RADIUS = 0.3;
        const PLAYER_HEIGHT = 1.6;

        let scene, camera, renderer, controls;
        let chunks = {}; // Stores combined mesh data mapping
        let worldData = {}; // Raw numerical block matrix layout data: "x,y,z" => blockType
        
        // Block Registry Definitions (Using standard matching colors)
        const blockRegistry = {
            1: { name: "Grass", color: 0x5c8e32, solid: true },
            2: { name: "Dirt", color: 0x866043, solid: true },
            3: { name: "Stone", color: 0x737373, solid: true },
            4: { name: "Oak Log", color: 0x6a4e32, solid: true },
            5: { name: "Leaves", color: 0x3b6622, solid: true },
            6: { name: "Planks", color: 0xb9935a, solid: true },
            7: { name: "Glass", color: 0xcfefff, solid: true },
            8: { name: "Water", color: 0x4277c4, solid: false }
        };

        // Inventory Systems Setup
        let hotbarIds = [1, 2, 3, 4, 6]; 
        let activeSlotIndex = 0;
        let hubOpen = false;

        // Player Controls States
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        const velocity = new THREE.Vector3();
        const clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xadcfff);
            scene.fog = new THREE.FogExp2(0xadcfff, 0.035);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
            camera.position.set(24, 15, 24);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 40, 15);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1); // Lock resolution to avoid low-end integrated GPU lag
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            document.getElementById('blocker').addEventListener('click', () => {
                if(!hubOpen) controls.lock();
            });
            controls.addEventListener('lock', () => document.getElementById('blocker').style.display = 'none');
            controls.addEventListener('unlock', () => {
                if(!hubOpen) document.getElementById('blocker').style.display = 'flex';
            });

            buildUI();
            generateTerrainData();
            renderAllChunks();
            setupControls();

            window.addEventListener('resize', onResize);
            animate();
        }

        // --- Procedural Generation (Terrain, Water, Trees) ---
        function generateTerrainData() {
            const maxCoord = CHUNK_SIZE * WORLD_CHUNKS_AXIS;
            
            // Phase 1: Basic Heightmap
            for(let x=0; x<maxCoord; x++) {
                for(let z=0; z<maxCoord; z++) {
                    let height = Math.floor(Math.sin(x*0.12) * Math.cos(z*0.12) * 3 + 7);
                    
                    for(let y=0; y<=14; y++) {
                        let key = `${x},${y},${z}`;
                        if(y === height && y > 5) worldData[key] = 1; // Grass Top
                        else if(y <= height && y > height - 3) worldData[key] = 2; // Dirt
                        else if(y <= height - 3) worldData[key] = 3; // Stone
                        else if(y <= 5) worldData[key] = 8; // Water Layer default basin
                    }
                }
            }

            // Phase 2: Grow Trees on Random Grass Blocks
            for(let x=4; x<maxCoord-4; x+=7) {
                for(let z=4; z<maxCoord-4; z+=7) {
                    if(Math.random() > 0.4) { 
                        let surfaceY = 0;
                        while(worldData[`${x},${surfaceY+1},${z}`] !== undefined) {
                            surfaceY++;
                        }
                        if(worldData[`${x},${surfaceY},${z}`] === 1) { // If it's grass, grow a tree
                            growTree(x, surfaceY + 1, z);
                        }
                    }
                }
            }
        }

        function growTree(tx, ty, tz) {
            // Trunk
            for(let i=0; i<4; i++) worldData[`${tx},${ty+i},${tz}`] = 4;
            // Foliage Leaves canopy box
            for(let lx=-1; lx<=1; lx++) {
                for(let lz=-1; lz<=1; lz++) {
                    for(let ly=2; ly<=4; ly++) {
                        let k = `${tx+lx},${ty+ly},${tz+lz}`;
                        if(!worldData[k]) worldData[k] = 5;
                    }
                }
            }
        }

        // --- HIGH OPTIMIZATION: Chunk Mesh Combiner Logic ---
        function renderAllChunks() {
            for(let cx=0; cx<WORLD_CHUNKS_AXIS; cx++) {
                for(let cz=0; cz<WORLD_CHUNKS_AXIS; cz++) {
                    buildChunkGeometry(cx, cz);
                }
            }
        }

        function buildChunkGeometry(cx, cz) {
            const chunkKey = `${cx},${cz}`;
            if(chunks[chunkKey]) scene.remove(chunks[chunkKey]);

            // Create temporary data holders for building a single combined geometry array buffer
            const positions = [];
            const colors = [];
            const startX = cx * CHUNK_SIZE;
            const startZ = cz * CHUNK_SIZE;

            const boxGeo = new THREE.BoxGeometry(1,1,1);

            for(let x=startX; x<startX+CHUNK_SIZE; x++) {
                for(let z=startZ; z<startZ+CHUNK_SIZE; z++) {
                    for(let y=0; y<16; y++) {
                        let type = worldData[`${x},${y},${z}`];
                        if(!type) continue;

                        // Check visibility optimization: Don't render faces hidden completely by solid blocks
                        let top = worldData[`${x},${y+1},${z}`];
                        let bot = worldData[`${x},${y-1},${z}`];
                        let left = worldData[`${x-1},${y},${z}`];
                        let right = worldData[`${x+1},${y},${z}`];
                        let front = worldData[`${x},${y},${z+1}`];
                        let back = worldData[`${x},${y},${z-1}`];

                        if(top && bot && left && right && front && back) continue; // Completely hidden block inside terrain

                        // Clone positions from standard matrix coordinates offsets
                        let tempMesh = new THREE.Mesh(boxGeo);
                        tempMesh.position.set(x, y, z);
                        tempMesh.updateMatrix();

                        // Extract vertex buffers to merge them into our optimized giant mesh mapping arrays
                        const posAttr = boxGeo.attributes.position;
                        const col = new THREE.Color(blockRegistry[type].color);

                        for(let i=0; i<posAttr.count; i++) {
                            let vertex = new THREE.Vector3().fromBufferAttribute(posAttr, i);
                            vertex.applyMatrix4(tempMesh.matrix);
                            positions.push(vertex.x, vertex.y, vertex.z);
                            colors.push(col.r, col.g, col.b);
                        }
                    }
                }
            }

            if(positions.length === 0) return;

            // Generate optimized BufferGeometry
            const combinedGeo = new THREE.BufferGeometry();
            combinedGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            combinedGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            combinedGeo.computeVertexNormals();

            const combinedMat = new THREE.MeshLambertMaterial({ vertexColors: true });
            const chunkMesh = new THREE.Mesh(combinedGeo, combinedMat);
            
            scene.add(chunkMesh);
            chunks[chunkKey] = chunkMesh;
        }

        function updateBlockAtPosition(x, y, z, type) {
            let key = `${x},${y},${z}`;
            if(type === 0) delete worldData[key];
            else worldData[key] = type;

            // Rebuild the localized chunk mesh instantly where modification took place
            let cx = Math.floor(x / CHUNK_SIZE);
            let cz = Math.floor(z / CHUNK_SIZE);
            buildChunkGeometry(cx, cz);
            
            // Rebuild neighbors if change occurred on border rims
            if(x % CHUNK_SIZE === 0) buildChunkGeometry(cx-1, cz);
            if(x % CHUNK_SIZE === CHUNK_SIZE-1) buildChunkGeometry(cx+1, cz);
            if(z % CHUNK_SIZE === 0) buildChunkGeometry(cx, cz-1);
            if(z % CHUNK_SIZE === CHUNK_SIZE-1) buildChunkGeometry(cx, cz+1);
        }

        // --- Collision System Mechanics ---
        function checkCollisions(pos) {
            let mX = Math.floor(pos.x - PLAYER_RADIUS), pX = Math.floor(pos.x + PLAYER_RADIUS);
            let mZ = Math.floor(pos.z - PLAYER_RADIUS), pZ = Math.floor(pos.z + PLAYER_RADIUS);
            let mY = Math.floor(pos.y - PLAYER_HEIGHT), pY = Math.floor(pos.y);

            for(let x=mX; x<=pX; x++) {
                for(let y=mY; y<=pY; y++) {
                    for(let z=mZ; z<=pZ; z++) {
                        let b = worldData[`${x},${y},${z}`];
                        if(b && blockRegistry[b].solid) return true;
                    }
                }
            }
            return false;
        }

        // --- Block Interaction Handlers ---
        function handleInteraction(isDestroy) {
            if(!controls.isLocked) return;
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);

            // Create temporary flat items targets array for math distance ray interception matches
            let hitTarget = null;
            let closestDist = 6; // Reach limit range

            Object.keys(worldData).forEach(key => {
                let coords = key.split(',').map(Number);
                let dist = camera.position.distanceTo(new THREE.Vector3(coords[0], coords[1], coords[2]));
                if(dist < closestDist) {
                    let intersects = ray.intersectBox(new THREE.Box3(
                        new THREE.Vector3(coords[0]-0.5, coords[1]-0.5, coords[2]-0.5),
                        new THREE.Vector3(coords[0]+0.5, coords[1]+0.5, coords[2]+0.5)
                    ), new THREE.Vector3());
                    if(intersects) {
                        closestDist = dist;
                        hitTarget = { coords: coords, rayHit: intersects };
                    }
                }
            });

            if(hitTarget) {
                let cx = hitTarget.coords[0];
                let cy = hitTarget.coords[1];
                let cz = hitTarget.coords[2];

                if(isDestroy) {
                    updateBlockAtPosition(cx, cy, cz, 0);
                } else {
                    // Place: Calculate closest geometric surface normal side vector face manually
                    let p = camera.position;
                    let nx = 0, ny = 0, nz = 0;
                    let dx = p.x - cx, dy = p.y - cy, dz = p.z - cz;
                    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > Math.abs(dz)) nx = dx > 0 ? 1 : -1;
                    else if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > Math.abs(dz)) ny = dy > 0 ? 1 : -1;
                    else nz = dz > 0 ? 1 : -1;

                    updateBlockAtPosition(cx+nx, cy+ny, cz+nz, hotbarIds[activeSlotIndex]);
                }
            }
        }

        // --- Interface UI Elements Renderer Systems ---
        function buildUI() {
            const bar = document.getElementById('hotbar');
            bar.innerHTML = '';
            hotbarIds.forEach((id, idx) => {
                let slot = document.createElement('div');
                slot.className = `slot ${idx === activeSlotIndex ? 'active' : ''}`;
                slot.style.backgroundColor = '#' + blockRegistry[id].color.toString(16);
                slot.innerText = blockRegistry[id].name;
                slot.onclick = () => { activeSlotIndex = idx; buildUI(); };
                bar.appendChild(slot);
            });

            // Populate Creative Inventory Interface
            const hub = document.getElementById('creative-hub');
            Object.keys(blockRegistry).forEach(id => {
                let bId = Number(id);
                let item = document.createElement('div');
                item.className = 'slot';
                item.style.backgroundColor = '#' + blockRegistry[bId].color.toString(16);
                item.innerText = blockRegistry[bId].name;
                item.onclick = () => {
                    hotbarIds[activeSlotIndex] = bId;
                    buildUI();
                    toggleHub();
                };
                hub.appendChild(item);
            });
        }

        function toggleHub() {
            hubOpen = !hubOpen;
            const hub = document.getElementById('creative-hub');
            if(hubOpen) {
                hub.style.display = 'flex';
                controls.unlock();
            } else {
                hub.style.display = 'none';
                controls.lock();
            }
        }

        // --- Inputs Configurations ---
        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyE') { toggleHub(); e.preventDefault(); return; }
                if(hubOpen) return;
                switch (e.code) {
                    case 'KeyW': moveF = true; break;
                    case 'KeyS': moveB = true; break;
                    case 'KeyA': moveL = true; break;
                    case 'KeyD': moveR = true; break;
                    case 'Space': if(canJump) { velocity.y = 6.2; canJump = false; } break;
                    case 'Digit1': activeSlotIndex = 0; buildUI(); break;
                    case 'Digit2': activeSlotIndex = 1; buildUI(); break;
                    case 'Digit3': activeSlotIndex = 2; buildUI(); break;
                    case 'Digit4': activeSlotIndex = 3; buildUI(); break;
                    case 'Digit5': activeSlotIndex = 4; buildUI(); break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveF = false; break;
                    case 'KeyS': moveB = false; break;
                    case 'KeyA': moveL = false; break;
                    case 'KeyD': moveR = false; break;
                }
            });

            document.addEventListener('mousedown', (e) => {
                if(hubOpen) return;
                if(e.button === 0) handleInteraction(true);
                if(e.button === 2) handleInteraction(false);
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Main Frame Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked && !hubOpen) {
                const delta = Math.min(clock.getDelta(), 0.1);

                velocity.y -= 18.0 * delta; // Gravity

                let dirX = Number(moveR) - Number(moveL);
                let dirZ = Number(moveF) - Number(moveB);
                
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0; camDir.normalize();
                const camRight = new THREE.Vector3().crossVectors(camDir, camera.up).normalize().negate();

                const moveVector = new THREE.Vector3();
                moveVector.addScaledVector(camDir, dirZ).addScaledVector(camRight, dirX).normalize().multiplyScalar(5.0 * delta);

                const playerObj = controls.getObject();

                playerObj.position.x += moveVector.x;
                if(checkCollisions(playerObj.position)) playerObj.position.x -= moveVector.x;

                playerObj.position.z += moveVector.z;
                if(checkCollisions(playerObj.position)) playerObj.position.z -= moveVector.z;

                playerObj.position.y += velocity.y * delta;
                if(checkCollisions(playerObj.position)) {
                    if(velocity.y < 0) canJump = true;
                    playerObj.position.y -= velocity.y * delta;
                    velocity.y = 0;
                }

                if(playerObj.position.y < -10) { playerObj.position.set(24, 15, 24); velocity.y = 0; }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
